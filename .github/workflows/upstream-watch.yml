name: upstream-watch

# Watches upstream deepseek-ai/deepseek-harness ("dsh") for new releases and
# notifies through a Feishu group-bot webhook. The seen list is the committed
# JSON array .github/dsh-upstream-seen.json; the workflow posts the tags
# missing from it and prepends them only after a successful send, so a failed
# send retries on the next schedule instead of silently recording the tags.
#
# Trigger: daily schedule (GitHub-hosted schedules run late by minutes to
# hours, tolerable for a daily notifier), or manual dispatch.
# Setup after merge: add the FEISHU_WEBHOOK_URL secret (Feishu custom-bot
# webhook) and, when the bot enforces signature checks, the
# FEISHU_WEBHOOK_SECRET secret.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Detect and notify, then record. Set difference between every upstream
      # release tag and the seen list, keeping the upstream order — upstream
      # interleaves lines (0.2.1-rc.5 sits between 0.2.2-alpha.2 and
      # alpha.3), so there is no semver comparison anywhere. The state write
      # happens only after a successful send; a push failure after a
      # successful send re-notifies the same tags next run, a visible
      # duplicate instead of lost state.
      - name: detect, notify, record
        run: |
          SEEN_FILE=.github/dsh-upstream-seen.json

          NEW_TAGS=$(gh api --paginate "repos/$UPSTREAM_REPO/releases" --jq '.[].tag_name' \
            | while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                jq -e --arg t "$tag" 'index($t)' "$SEEN_FILE" >/dev/null || printf '%s\n' "$tag"
              done)
          if [ -z "$NEW_TAGS" ]; then
            echo "No new upstream releases."
            exit 0
          fi
          echo "New upstream releases:"
          echo "$NEW_TAGS"

          COUNT=$(printf '%s\n' "$NEW_TAGS" | wc -l)
          RELEASES_URL="https://github.com/$UPSTREAM_REPO/releases"
          TEXT=$(printf 'prism-agent 上游 dsh 有 %d 个新 release：\n%s\n%s\n同步方法见 docs/compose/spec/upstream-resync-0.2.2-rc.1.md' \
            "$COUNT" "$(printf '%s\n' "$NEW_TAGS" | sed 's/^/• /')" "$RELEASES_URL")

          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::FEISHU_WEBHOOK_URL is not set; cannot notify."
            exit 1
          fi

          if [ -n "$FEISHU_WEBHOOK_SECRET" ]; then
            TIMESTAMP=$(date +%s)
            SIGN=$(printf '%s\n%s' "$TIMESTAMP" "$FEISHU_WEBHOOK_SECRET" \
              | openssl dgst -sha256 -hmac "$FEISHU_WEBHOOK_SECRET" -binary | base64)
            PAYLOAD=$(jq -n --arg ts "$TIMESTAMP" --arg sign "$SIGN" --arg text "$TEXT" \
              '{timestamp: $ts, sign: $sign, msg_type: "text", content: {text: $text}}')
          else
            PAYLOAD=$(jq -n --arg text "$TEXT" '{msg_type: "text", content: {text: $text}}')
          fi

          RESP=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$FEISHU_WEBHOOK_URL")
          echo "Feishu response: $RESP"
          CODE=$(printf '%s' "$RESP" | jq -r '.code // .StatusCode // 1')
          if [ "$CODE" != "0" ]; then
            echo "::error::Feishu webhook rejected the message: $RESP"
            exit 1
          fi

          jq --argjson new "$(printf '%s\n' "$NEW_TAGS" | jq -R '.' | jq -s '.')" '$new + .' \
            "$SEEN_FILE" > "$SEEN_FILE.tmp"
          mv "$SEEN_FILE.tmp" "$SEEN_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SEEN_FILE"
          git commit -m "chore(ci): record upstream dsh release(s) $(printf '%s\n' "$NEW_TAGS" | paste -sd ' ' -) as seen"
          git push
