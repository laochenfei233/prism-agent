# PRISM-DIVERGENCE: replay list in docs/compose/spec/fork-upstream-divergence.md (S2), area A13.
# The Web account login scenario points the shipped account provider at a loopback
# Platform double. The scenario substitutes {{origin}} after the listener binds,
# so no port is ever committed here.
- id: deepseek-account
  config:
    platformOrigin: "{{origin}}"
    allowLoopbackHttp: true
# The scenario signs in from the DeepSeek card on the Models page; the keyless
# replay masks the ambient key, so the automatic first-run credential dialog is
# suppressed to keep the DeepSeek card clickable.
- id: ui-settings-account
  config:
    step: done
    completion: completed
- id: ui-settings-models
  config:
    credentialOnboarding: false
