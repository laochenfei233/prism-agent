# Test-only composition: mount the prism-team bundle over the shipped Web
# surface so the session-header Team chip and its panel can be exercised in a
# real browser. The row points at the bundle's built entry by relative path —
# the form a checkout that has not installed the package needs. The plugin is
# zero-behavior until a session enables a Team, so an ordinary page shows only
# the header chip.
- insert:
    - id: prism-team
      name: '../../../plugins/prism-team/lib/index.js'
      config:
        mode: enforce
        worktree: true
        maxReports: 200
        writeTools:
          - tool: write
            pathArgument: file_path
          - tool: edit
            pathArgument: file_path
          - tool: str_replace_editor
            pathArgument: path
