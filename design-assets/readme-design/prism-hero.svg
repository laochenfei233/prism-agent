<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="prism-hero-title prism-hero-desc">
  <title id="prism-hero-title">Prism Agent</title>
  <desc id="prism-hero-desc">Prism Agent: a ready-to-run local AI agent built on DeepSeek Harness, with the desktop shell, bundled plugins, and an isolated install wired on first launch. White light enters the prism mark and leaves as a spectrum.</desc>

  <defs>
    <linearGradient id="prism-hero-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151E"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </linearGradient>
    <radialGradient id="prism-hero-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#prism-hero-glow)"/>
  <circle cx="968" cy="180" r="158" fill="url(#prism-hero-halo)"/>

  <g id="incoming-ray">
    <line x1="744" y1="117.5" x2="848" y2="117.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g id="prism-mark" transform="translate(968 180) scale(12.5) translate(-12 -12)" stroke="#FFFFFF" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <path d="M12 2 L20.66 7 L20.66 17 L12 22 L3.34 17 L3.34 7 Z" fill="none"/>
    <path d="M12 12 L12 2 M12 12 L20.66 7 M12 12 L20.66 17 M12 12 L12 22 M12 12 L3.34 17 M12 12 L3.34 7" fill="none" opacity="0.85"/>
    <circle cx="12" cy="12" r="2.3" fill="#FFFFFF" stroke="none"/>
    <circle cx="12" cy="2" r="1.7" fill="#FFFFFF" stroke="none"/>
    <circle cx="20.66" cy="7" r="1.7" fill="#FFFFFF" stroke="none"/>
    <circle cx="20.66" cy="17" r="1.7" fill="#FFFFFF" stroke="none"/>
    <circle cx="12" cy="22" r="1.7" fill="#FFFFFF" stroke="none"/>
    <circle cx="3.34" cy="17" r="1.7" fill="#FFFFFF" stroke="none"/>
    <circle cx="3.34" cy="7" r="1.7" fill="#FFFFFF" stroke="none"/>
  </g>

  <g id="dispersion-fan" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.92">
    <line x1="1084" y1="246" x2="1150" y2="204" stroke="#FF5C57"/>
    <line x1="1084" y1="246" x2="1150" y2="242" stroke="#FFB13D"/>
    <line x1="1084" y1="246" x2="1150" y2="272" stroke="#3DDC97"/>
    <line x1="1084" y1="246" x2="1150" y2="300" stroke="#4C8DFF"/>
    <line x1="1084" y1="246" x2="1150" y2="322" stroke="#A56EFF"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2" fill="#8E8E9C">OUT-OF-THE-BOX · DEEPSEEK HARNESS DISTRIBUTION</text>
    <text x="72" y="152" font-size="78" font-weight="700" fill="#FFFFFF">Prism Agent</text>
    <text x="72" y="200" font-size="26" fill="#C9CAD6">A ready-to-run local AI agent for your desktop.</text>
    <text x="72" y="236" font-size="20" fill="#8E8E9C">Bundled plugins. Desktop shell. Isolated install.</text>
  </g>

  <g id="fact-chips" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">
    <rect x="72" y="264" width="194" height="44" rx="20" fill="#13131A" stroke="#26262F"/>
    <text x="96" y="292" fill="#E6E6EE">Windows · macOS</text>
    <rect x="282" y="264" width="225" height="44" rx="20" fill="#13131A" stroke="#26262F"/>
    <text x="306" y="292" fill="#E6E6EE">11 bundled plugins</text>
    <rect x="523" y="264" width="194" height="44" rx="20" fill="#13131A" stroke="#26262F"/>
    <text x="547" y="292" fill="#E6E6EE">10-agent import</text>
  </g>
</svg>
