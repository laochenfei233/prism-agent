# The prism-guardrails bundle patch: one row over the profile root.
#
# `name` is the bundle's package name — the form a profile resolves once the
# bundle is installed or published. A checkout that has not installed it points
# the row at the built entry instead:
#   name: 'file:///absolute/path/to/plugins/prism-guardrails/lib/index.js'
#
# Every rail is off until its key names a value, so this row is the deployment
# policy the bundle was written for, not a set of built-in fallbacks. A key that
# is present but unusable fails plugin load rather than silently disabling a rail.
#
# `writeTools` and `routingContract.readOnlyTools` name DeepSeek Harness's own
# tool set (`packages/fs/tool-fs`, `packages/fs/tool-fs-search`,
# `packages/shell/tool-bash`, `packages/shell/tool-pwsh`). A profile whose tools
# differ edits these names; nothing else in the bundle assumes them.
- insert:
    - id: prism-guardrails
      name: 'prism-guardrails'
      config:
        planDeniedTools: [write, edit, str_replace_editor]
        repeatAskAfter: 5
        maxStepsPerTurn: 200
        unfinishedTodoContinuations: 3
        skillInvocationGuidance: true
        writeTools:
          - { tool: write, pathArgument: file_path, contentArgument: content }
          - { tool: edit, pathArgument: file_path, contentArgument: new_string }
        maxWrittenFilesPerTurn: 8
        requirePonytailUpgradePaths: true
        dependencyManifests: [package.json]
        routingContract:
          readOnlyTools: [read, read_image, glob, grep]
        verificationGate:
          verifyTools: [bash, pwsh]

    # The Ponytail mode itself: one system-prompt section carrying the level and
    # the slash commands the skill set used to describe. Mounted from the bundle
    # patch rather than a preset, so every agent mode reads the same section and
    # every profile gets the same commands; `level: off` silences it without
    # unmounting the row.
    #
    # A session under a coding preset, or one that opens this many steps, runs
    # at lite on its own. Add a deployment's own preset ids to
    # `autoCodingPresets`; `/ponytail auto|full|lite|ultra|off` still wins for
    # the session that issued it.
    - id: prism-guardrails-ponytail
      name: 'prism-guardrails/ponytail'
      config:
        level: full
        autoCodingPresets: [standard, ptc]
        autoLongTaskSteps: 20
