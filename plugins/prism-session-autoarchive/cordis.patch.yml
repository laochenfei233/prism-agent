# The prism-session-autoarchive bundle patch: one row over the profile root.
#
# `name` is the bundle's package name — the form a profile resolves once the
# bundle is installed or published. A checkout that has not installed it points
# the row at the built entry instead:
#   name: 'file:///absolute/path/to/plugins/prism-session-autoarchive/lib/index.js'
#
# The defaults below are the shipped values: automatic hygiene is OFF until a
# deployment turns `enabled` on; a conversation then archives after 30 idle
# days, an idle project after 14 quiet days, and the default Workspace is
# exempt unless `includeDefaultWorkspace` is on. Sweeps run once a day. Every
# field is live-editable from the Settings page the plugin's schema generates.
- insert:
    - id: prism-session-autoarchive
      name: 'prism-session-autoarchive'
      config:
        enabled: false
        idleDays: 30
        projectIdleDays: 14
        includeDefaultWorkspace: false
        sweepIntervalMinutes: 1440
