# The Prism Local Models row: one Host service (catalog, download, inference).
# The browser half joins the client roster through the package's `dsh.client`
# manifest, so the row name must stay the bare package name the profile can
# resolve. `webStartup` exists on every profile that mounts the web-app
# bundle, which is the only place this plugin is meant to load.
- insert:
    - id: local-models
      name: '@prism/prism-local-models'
      inject: [webStartup]
